services:
  pocket-time-buddy:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    container_name: pocket-time-buddy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./site:/usr/share/nginx/html:ro
    # Nginx Proxy Manager forwards to http://pocket-time-buddy:8080 over the shared network.
    networks:
      - proxy

networks:
  proxy:
    external: true
