<title>Pocket Time Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen phone app. Hours run down, cities run across; home column and city header stay pinned while the grid scrolls. */
:root {
  --paper: #F4F6F9;
  --surface: #FFFFFF;
  --ink: #142030;
  --muted: #566476;
  --line: #D9E0E9;
  --night: #22304D;  --night-ink: #C7D2E6;
  --edge:  #F4E4C6;  --edge-ink:  #5A4020;
  --work:  #E3F0FB;  --work-ink:  #142030;
  --accent: #E2560B;
  --accent-ink: #FFFFFF;
  --font-ui: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-num: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --col: 86px;
  --row: 46px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0D131C; --surface: #151D29; --ink: #E5EBF2; --muted: #8E9BAD; --line: #263142;
    --night: #080C14; --night-ink: #7183A0;
    --edge: #3B2E1B;  --edge-ink: #EBCB97;
    --work: #1A2B40;  --work-ink: #E5EBF2;
    --accent: #FF7B34; --accent-ink: #1A0C03;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0D131C; --surface: #151D29; --ink: #E5EBF2; --muted: #8E9BAD; --line: #263142;
  --night: #080C14; --night-ink: #7183A0;
  --edge: #3B2E1B;  --edge-ink: #EBCB97;
  --work: #1A2B40;  --work-ink: #E5EBF2;
  --accent: #FF7B34; --accent-ink: #1A0C03;
}

html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font: 15px/1.4 var(--font-ui);
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; max-width: 960px; margin: 0 auto; }

/* Top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 16px 10px; }
.brand { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; margin-right: auto; }
.datenav { display: flex; align-items: center; gap: 6px; flex-basis: 100%; }
#date { flex: 1; min-width: 0; }
.iconbtn {
  width: 40px; height: 40px; display: grid; place-items: center;
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
}
.iconbtn svg { width: 18px; height: 18px; }
#date {
  height: 40px; padding: 0 8px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); font-family: var(--font-num); font-size: 14px;
}
.pill {
  height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 500;
}
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { height: 38px; min-width: 48px; padding: 0 12px; border: 0; background: none; font-family: var(--font-num); font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* Grid */
.scroller { flex: 1; overflow: auto; overscroll-behavior: contain; border-top: 1px solid var(--line); }
.grid { min-width: max-content; }
.row {
  display: grid; grid-template-columns: repeat(var(--n), minmax(var(--col), 1fr));
  width: 100%; border: 0; padding: 0; background: none; text-align: center;
}
.head { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.hc {
  padding: 10px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 1px;
  background: var(--paper); border: 0; min-width: 0;
}
.hc .name {
  font-size: 13px; font-weight: 500; max-width: 100%;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  display: flex; align-items: center; gap: 3px;
}
.hc .name svg { width: 12px; height: 12px; flex: none; color: var(--accent); }
.hc .big { font-family: var(--font-num); font-size: 21px; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.hc .big small { font-size: 12px; margin-left: 1px; }
.hc .meta { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.sticky-l { position: sticky; left: 0; z-index: 2; }
.head .sticky-l { z-index: 6; box-shadow: 1px 0 0 var(--line); }

.cell {
  height: var(--row); display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-family: var(--font-num); font-size: 15px; font-variant-numeric: tabular-nums; line-height: 1.1;
  border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent);
}
.cell small { font-size: 10.5px; opacity: .75; }
.cell.night { background: var(--night); color: var(--night-ink); }
.cell.edge  { background: var(--edge);  color: var(--edge-ink); }
.cell.work  { background: var(--work);  color: var(--work-ink); }
.cell.day   { background: var(--surface); color: var(--ink); }
.cell.mid { font-family: var(--font-ui); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.cell.mid span { font-family: var(--font-num); font-size: 13px; font-weight: 500; text-transform: none; letter-spacing: 0; }
.row .sticky-l { box-shadow: 1px 0 0 var(--line); }
/* Cities off the default city's hour grid (e.g. +5:45) are drawn as a shifted column over blank cells,
   so their cells start at real hour boundaries. Flex weights are minutes. */
.shiftcol { position: absolute; top: 0; bottom: 0; display: flex; flex-direction: column; pointer-events: none; z-index: 1; }
.shiftcol .cell { height: auto; min-height: 0; flex: var(--w) 1 0; overflow: hidden; }
.shiftcol .cell.newday { position: relative; }
.cell.gap { background: var(--paper); }
/* Midnight line: drawn where the city's new day starts, mid-row for :30 / :45 offsets. */
.cell.newday:not(.sticky-l) { position: relative; }
.cell.newday::before {
  content: ""; position: absolute; left: 0; right: 0; top: var(--mid, 0%); height: 3px; margin-top: -1px;
  background: var(--night-ink); pointer-events: none;
}

.hc .till { font-family: var(--font-num); font-size: 12.5px; color: var(--muted); }
.hc .till small { font-size: 10px; }
.hours { position: relative; }
.hours .row { position: relative; }
/* Selected interval: a band over all cities, resized by its two grips in 15-minute steps. */
.selband {
  position: absolute; left: 0; right: 0; z-index: 3; pointer-events: none; box-sizing: border-box;
  border: 2px solid var(--accent); border-radius: 6px;
  background: color-mix(in srgb, var(--accent) 14%, transparent);
}
.grip {
  position: absolute; left: 0; right: 0; height: 30px; padding: 0; border: 0; background: none;
  pointer-events: auto; touch-action: none; cursor: ns-resize;
}
.grip.top { top: -16px; }
.grip.bot { bottom: -16px; }
.grip span {
  position: sticky; left: 0; width: min(100%, var(--vw, 100%)); height: 100%;
  display: flex; align-items: center; justify-content: flex-end; padding-right: 5px; box-sizing: border-box;
}
.grip span::before {
  content: ""; width: 28px; height: 10px; border-radius: 5px;
  background: var(--accent); box-shadow: 0 0 0 2px var(--surface);
}
.grip:focus-visible { outline: none; }
.grip:focus-visible span::before { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.hours .row[aria-pressed="true"] .cell { font-weight: 500; }
.hours .row.now .sticky-l::before {
  content: "NOW"; position: absolute; left: 4px; top: 4px;
  font: 700 8.5px/1 var(--font-ui); letter-spacing: .08em;
  background: var(--accent); color: var(--accent-ink); padding: 2px 3px; border-radius: 3px;
}
.hours .sticky-l { position: sticky; }

/* Bottom bar */
.bar { display: flex; gap: 6px; padding: 10px 16px 12px; background: var(--paper); }
.bar button { flex: 1; min-width: 0; height: 48px; white-space: nowrap; border-radius: 12px; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 6px; }
.bar svg { width: 18px; height: 18px; flex: none; }
.primary { background: var(--ink); color: var(--paper); border: 0; }
.secondary { background: var(--surface); border: 1px solid var(--line); }

.summary {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 10px 16px 0;
  border-top: 1px solid var(--line); background: var(--paper);
}
.summary .range { font-family: var(--font-num); font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; }
.summary .range small { font-size: 11px; }
.summary .dur { font-weight: 700; color: var(--accent); }
.summary .where { color: var(--muted); font-size: 13px; }
.legend { display: flex; gap: 12px; padding: 0 16px 8px; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; border: 1px solid var(--line); }

/* Sheets */
dialog {
  border: 0; padding: 0; width: min(560px, 100%); max-width: 100%; max-height: 85%;
  margin: auto auto 0; border-radius: 18px 18px 0 0;
  background: var(--surface); color: var(--ink);
}
@media (min-width: 640px) { dialog { margin: auto; border-radius: 18px; } }
dialog::backdrop { background: rgb(8 12 20 / .45); }
.sheet { display: flex; flex-direction: column; gap: 12px; padding: 18px 16px calc(16px + env(safe-area-inset-bottom, 0px)); max-height: 80vh; }
.sheet h2 { margin: 0; font-size: 17px; text-wrap: balance; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#q {
  height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); font-size: 16px;
}
#results { list-style: none; margin: 0; padding: 0; overflow: auto; display: flex; flex-direction: column; }
#results button {
  width: 100%; min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; padding: 6px 4px;
}
#results .r-name { font-weight: 500; }
#results .r-tz { font-size: 12px; color: var(--muted); }
#results .r-time { font-family: var(--font-num); font-size: 14px; color: var(--muted); white-space: nowrap; }
.empty { color: var(--muted); padding: 12px 4px; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.credit { font-size: 11.5px; }
.credit a { color: inherit; }
#cityList { list-style: none; margin: 0; padding: 0; overflow: auto; }
#cityList li { display: flex; align-items: center; gap: 8px; min-height: 60px; border-bottom: 1px solid var(--line); }
#cityList .c-info { flex: 1; min-width: 0; }
#cityList .c-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#cityList .c-meta { font-size: 12px; color: var(--muted); font-family: var(--font-num); }
.tag { height: 36px; padding: 0 12px; border-radius: 18px; font-size: 13px; font-weight: 500; white-space: nowrap;
  border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; gap: 4px; }
.tag svg { width: 14px; height: 14px; }
.tag.is-default { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); cursor: default; }
.danger { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px; background: none; border: 1px solid var(--line); color: #C2410C; }
.danger svg { width: 18px; height: 18px; }
.danger:disabled { opacity: .35; cursor: not-allowed; }
.big-btn { height: 48px; border-radius: 12px; font-weight: 700; }
:root[data-theme="dark"] .danger { color: #FF9A6B; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .danger { color: #FF9A6B; } }

.toast {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; font-weight: 500;
  max-width: calc(100% - 32px); z-index: 10; text-align: center;
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">Pocket Time Buddy</div>
    <div class="seg" role="group" aria-label="Clock format">
      <button id="f12" aria-pressed="false">12h</button>
      <button id="f24" aria-pressed="true">24h</button>
    </div>
    <div class="datenav">
      <button class="iconbtn" id="prev" aria-label="Previous day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <input type="date" id="date" aria-label="Date in default city">
      <button class="iconbtn" id="next" aria-label="Next day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="pill" id="now">Now</button>
    </div>
  </header>
  <div class="legend" aria-hidden="true">
    <span><i style="background:var(--work)"></i>8–18 work</span>
    <span><i style="background:var(--edge)"></i>early / evening</span>
    <span><i style="background:var(--night)"></i>night</span>
  </div>
  <div class="scroller" id="scroller">
    <div class="grid" id="grid"></div>
  </div>
  <div class="summary" id="summary" aria-live="polite"></div>
  <div class="bar">
    <button class="secondary" id="copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copy</button>
    <button class="secondary" id="share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>Link</button>
    <button class="secondary" id="manage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Cities</button>
    <button class="primary" id="add" aria-label="Add city"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add</button>
  </div>
</div>

<dialog id="addDlg" aria-labelledby="addTitle">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="addTitle">Add a city</h2>
      <button class="iconbtn" id="addClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <input id="q" type="search" placeholder="City or time zone, e.g. Bangalore" autocomplete="off" aria-label="Search cities">
    <ul id="results"></ul>
    <p class="hint credit">City data: <a href="https://www.geonames.org/">GeoNames</a>, CC BY 4.0</p>
  </div>
</dialog>

<dialog id="cityDlg" aria-labelledby="cityTitle">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="cityTitle">Your cities</h2>
      <button class="iconbtn" id="cityClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <p class="hint">The default city is the left column and sets the day you browse.</p>
    <ul id="cityList"></ul>
    <button class="primary big-btn" id="addFromList">Add city</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

  if (row) {
    if (suppressClick) return;
    const t = rows[+row.dataset.row]; sel = { t0: t, t1: t + HOUR }; updateSel(); return;
  }
  const hc = e.target.closest("[data-city]");
  if (hc) openCities();
});
// Changing the day keeps the same time of day selected.
function goDay(y, mo, d) {
  const old = rows[0]; setDay(y, mo, d);
  const shift = localToUtc(state.cities[0].tz, day.y, day.mo, day.d) - old;
  sel = { t0: sel.t0 + shift, t1: sel.t1 + shift }; render();
}
$("#prev").onclick = () => goDay(day.y, day.mo, day.d - 1);
$("#next").onclick = () => goDay(day.y, day.mo, day.d + 1);
$("#date").onchange = e => { const [y, mo, d] = e.target.value.split("-").map(Number); if (y) goDay(y, mo, d); };

// Interval selection: grips resize with any pointer; a mouse can also drag across rows.
let drag = null, suppressClick = false;
function yToT(clientY) {
  const top = $("#hours").getBoundingClientRect().top;
  const q = Math.round((clientY - top) / (rowPx() / 4));
  return rows[0] + Math.max(0, Math.min(rows.length * 4, q)) * QMS;
}
function applyDrag() {
  const t = yToT(drag.y);
  if (drag.mode === "t0") sel.t0 = Math.min(t, sel.t1 - QMS);
  else if (drag.mode === "t1") sel.t1 = Math.max(t, sel.t0 + QMS);
  else {
    if (Math.abs(drag.y - drag.y0) > 6) drag.moved = true;
    if (!drag.moved) return;
    sel = t === drag.anchor ? { t0: t, t1: t + QMS } : { t0: Math.min(t, drag.anchor), t1: Math.max(t, drag.anchor) };
    sel.t1 = Math.min(sel.t1, rows[0] + rows.length * HOUR);
  }
  updateSel();
}
// Dragging near the top or bottom edge scrolls the table.
function autoscroll() {
  if (!drag) return;
  const sc = $("#scroller"), r = sc.getBoundingClientRect(), top = r.top + $("#head").offsetHeight, zone = 48;
  const v = drag.y < top + zone ? -(top + zone - drag.y) : drag.y > r.bottom - zone ? drag.y - (r.bottom - zone) : 0;
  if (v) { sc.scrollTop += Math.max(-24, Math.min(24, v / 3)); applyDrag(); }
  requestAnimationFrame(autoscroll);
}
const grid = $("#grid");
grid.addEventListener("pointerdown", e => {
  const grip = e.target.closest(".grip");
  if (grip) drag = { mode: grip.dataset.edge };
  else if (e.pointerType === "mouse" && e.button === 0 && e.target.closest("[data-row]"))
    drag = { mode: "new", anchor: yToT(e.clientY), y0: e.clientY, moved: false };
  else return;
  drag.y = e.clientY;
  e.preventDefault();
  try { grid.setPointerCapture(e.pointerId); } catch {}
  requestAnimationFrame(autoscroll);
});
grid.addEventListener("pointermove", e => { if (drag) { drag.y = e.clientY; applyDrag(); } });
const endDrag = () => {
  if (!drag) return;
  if (drag.moved) { suppressClick = true; setTimeout(() => suppressClick = false, 0); }
  drag = null;
};
grid.addEventListener("pointerup", endDrag);
grid.addEventListener("pointercancel", endDrag);
grid.addEventListener("keydown", e => {
  const grip = e.target.closest(".grip");
  if (!grip || !["ArrowUp", "ArrowDown"].includes(e.key)) return;
  e.preventDefault();
  const step = e.key === "ArrowUp" ? -QMS : QMS, end = rows[0] + rows.length * HOUR;
  if (grip.dataset.edge === "t0") sel.t0 = Math.max(rows[0], Math.min(sel.t0 + step, sel.t1 - QMS));
  else sel.t1 = Math.min(end, Math.max(sel.t1 + step, sel.t0 + QMS));
  updateSel();
});
$("#now").onclick = () => { const t = today(); setDay(t.y, t.mo, t.d); sel = null; render(true); };
$("#f12").onclick = () => { state.h24 = false; save(); render(); };
$("#f24").onclick = () => { state.h24 = true; save(); render(); };

function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 1800);
}
$("#copy").onclick = async () => {
  const txt = state.cities.map(c => {
    const p = parts(c.tz, sel.t0), p1 = parts(c.tz, sel.t1);
    const endDay = p1.d !== p.d ? `${p1.wd} ${p1.d} ${MONTHS[p1.mo - 1]}, ` : "";
    return `${c.name}: ${p.wd} ${p.d} ${MONTHS[p.mo - 1]}, ${plain(p)}–${endDay}${plain(p1)}`;
  }).join("\n");
  try { await navigator.clipboard.writeText(txt); toast("Copied times for all cities"); }
  catch { toast("This browser blocked clipboard access."); }
};

// Add city sheet
const fold = t => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/ł/gi, "l").toLowerCase();
let regionName = cc => cc;
try { const dn = new Intl.DisplayNames(["en"], { type: "region" }); regionName = cc => dn.of(cc) || cc; } catch {}
let zones = [];
try { zones = Intl.supportedValuesOf("timeZone"); } catch { zones = ["UTC"]; }
const known = new Set(zones);
const okZone = tz => known.has(tz) || validTz(tz);
const cities = CITY_DATA.split(";").map(r => r.split("|")).map(([name, cc, i]) => ({ name, tz: CITY_ZONES[+i], where: regionName(cc) }))
  .filter(c => okZone(c.tz));
// One entry per accent-insensitive name and zone, so "Zurich" and "Zürich" don't both appear.
const seenName = new Set();
const catalog = [
  ...cities,
  ...zones.filter(z => z.includes("/")).map(tz => ({ name: cityName(tz), tz, where: "Time zone" })),
  { name: "UTC", tz: "UTC", where: "Time zone" }
].filter(c => {
  const n = fold(c.name), k = n + "|" + c.tz, dup = seenName.has(k) || (c.where === "Time zone" && seenName.has(n));
  seenName.add(k); seenName.add(n); return !dup;
})
 .map((c, i) => ({ ...c, i, key: fold(`${c.name} ${c.where}`), tzKey: fold(c.tz.replaceAll("_", " ")) }));
// Rank: exact name, name prefix, word prefix, anywhere, country or zone; ties keep the biggest city first.
function rank(c, q) {
  const n = fold(c.name);
  if (n === q) return 0;
  if (n.startsWith(q)) return 1;
  if ((" " + n).includes(" " + q)) return 2;
  if (n.includes(q)) return 3;
  if (c.key.includes(q) || c.tzKey.includes(q)) return 4;
  return -1;
}
function search() {
  const q = fold($("#q").value.trim());
  const hits = (q ? catalog.map(c => [rank(c, q), c]).filter(([r]) => r >= 0).sort((a, b) => a[0] - b[0] || a[1].i - b[1].i).map(([, c]) => c) : catalog)
    .slice(0, 60);
  const now = Date.now();
  $("#results").innerHTML = hits.length ? hits.map(c =>
    `<li><button data-i="${c.i}"><span><span class="r-name">${c.name}</span><br><span class="r-tz">${c.where} · ${c.tz.replaceAll("_", " ")}</span></span>
     <span class="r-time">${fmtTime(parts(c.tz, now), state.h24)}</span></button></li>`).join("")
    : `<li class="empty">No city or time zone matches “${$("#q").value}”. Try the nearest large city.</li>`;
}
$("#add").onclick = () => { $("#q").value = ""; search(); $("#addDlg").showModal(); $("#q").focus(); };
$("#addClose").onclick = () => $("#addDlg").close();
$("#q").oninput = search;
$("#results").onclick = e => {
  const b = e.target.closest("[data-i]"); if (!b) return;
  const c = catalog[+b.dataset.i];
  if (state.cities.some(x => x.tz === c.tz && x.name === c.name)) { toast(`${c.name} is already on the grid`); return; }
  adopt(); state.cities.push({ tz: c.tz, name: c.name }); save(); render();
  $("#addDlg").close(); toast(`Added ${c.name}`);
};

// Cities sheet: set default / remove
const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
function renderCities() {
  const now = Date.now();
  $("#cityList").innerHTML = state.cities.map((c, i) => `<li>
    <div class="c-info"><div class="c-name">${c.name}</div>
      <div class="c-meta">${fmtTime(parts(c.tz, now), state.h24).replace(/<\/?small>/g, "")} · ${c.tz.replaceAll("_", " ")}</div></div>
    ${i ? `<button class="tag" data-default="${i}">Set default</button>`
        : `<span class="tag is-default">${HOME_ICON}Default</span>`}
    <button class="danger" data-remove="${i}" aria-label="Remove ${c.name}" ${state.cities.length < 2 ? "disabled" : ""}>${TRASH}</button>
  </li>`).join("");
}
function openCities() { renderCities(); $("#cityDlg").showModal(); }
$("#manage").onclick = openCities;
$("#cityClose").onclick = () => $("#cityDlg").close();
$("#addFromList").onclick = () => { $("#cityDlg").close(); $("#add").click(); };
$("#cityList").onclick = e => {
  const d = e.target.closest("[data-default]"), r = e.target.closest("[data-remove]");
  if (d) {
    adopt(); const [c] = state.cities.splice(+d.dataset.default, 1); state.cities.unshift(c); save();
    const p = parts(c.tz, sel.t0); setDay(p.y, p.mo, p.d);
    render(true); renderCities(); toast(`${c.name} is now the default`);
  } else if (r && state.cities.length > 1) {
    adopt(); const i = +r.dataset.remove, [c] = state.cities.splice(i, 1); save();
    if (i === 0) { const t = today(); setDay(t.y, t.mo, t.d); sel = null; }
    render(); renderCities(); toast(`Removed ${c.name}`);
  }
};
for (const d of document.querySelectorAll("dialog")) d.addEventListener("click", e => { if (e.target === d) d.close(); });

$("#share").onclick = async () => {
  try { await navigator.clipboard.writeText(linkFor()); toast("Link copied"); }
  catch { toast("This browser blocked clipboard access."); }
};

// Boot
window.addEventListener("hashchange", () => location.reload());
const link = readLink();
if (link) {
  shared = true;
  state.cities = link.cities;
  if (link.f) state.h24 = link.f !== "12";
}
const t0 = link?.day || today(); setDay(t0.y, t0.mo, t0.d);
pendingSpan = link?.span || null;
render(true);
if (link) toast("Showing a shared view. Your saved cities are unchanged.");
setInterval(() => { if (!drag && !document.querySelector("dialog[open]")) render(); }, 60000);
</script>
